<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrecificaPro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0d0d0f;color:#f5f5f5}
header{background:#151518;border-bottom:1px solid #29292e;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800}.logo span{color:#e3262e}
.container{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#151518;border:1px solid #29292e;border-radius:14px;padding:20px;box-shadow:0 8px 25px #0004}
h2{margin-top:0}label{display:block;font-size:13px;color:#aaa;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #33343a;background:#0f0f11;color:white;border-radius:8px;outline:none}
input:focus,select:focus{border-color:#e3262e}
button{border:0;border-radius:8px;padding:11px 15px;background:#e3262e;color:#fff;font-weight:bold;cursor:pointer;margin-top:12px}
button:hover{filter:brightness(1.1)}button.secondary{background:#29292e}.danger{background:#8e171c}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid #29292e;text-align:left}th{color:#aaa}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.kpi{background:#151518;border:1px solid #29292e;border-radius:12px;padding:15px}.kpi small{color:#999}.kpi strong{display:block;font-size:22px;margin-top:6px}
.total{font-size:30px;font-weight:800;color:#ff4b52;margin-top:10px}
.recipe-row{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.badge{display:inline-block;background:#29292e;border-radius:20px;padding:5px 9px;font-size:12px}
.empty{text-align:center;color:#888;padding:20px}.full{grid-column:1/-1}
@media(max-width:800px){.grid,.kpis{grid-template-columns:1fr}.recipe-row{grid-template-columns:1fr 1fr}.container{padding:14px}header{padding:15px}}
</style>
</head>
<body>
<header><div class="logo">Precifica<span>Pro</span></div><div class="badge">Precificação inteligente</div></header>

<div class="container">
<div class="kpis">
<div class="kpi"><small>Ingredientes</small><strong id="kIng">0</strong></div>
<div class="kpi"><small>Produtos</small><strong id="kProd">0</strong></div>
<div class="kpi"><small>Custo do produto</small><strong id="kCost">R$ 0,00</strong></div>
<div class="kpi"><small>Lucro por unidade</small><strong id="kProfit">R$ 0,00</strong></div>
</div>

<div class="grid">
<section class="card">
<h2>🥩 Ingredientes</h2>
<label>Nome</label><input id="ingName" placeholder="Ex.: Queijo">
<label>Quantidade comprada</label><input id="ingQty" type="number" step="0.001" placeholder="Ex.: 1">
<label>Unidade</label><select id="ingUnit"><option value="kg">kg</option><option value="g">g</option><option value="L">L</option><option value="ml">ml</option><option value="un">unidade</option></select>
<label>Preço pago</label><input id="ingPrice" type="number" step="0.01" placeholder="Ex.: 35">
<button onclick="addIngredient()">Adicionar ingrediente</button>
<div id="ingredients"></div>
</section>

<section class="card">
<h2>🥟 Produto / Receita</h2>
<label>Nome do produto</label><input id="prodName" placeholder="Ex.: Pastel de Frango">
<div id="recipe"></div>
<button class="secondary" onclick="addRecipeRow()">+ Adicionar ingrediente à receita</button><br>
<label>Preço de venda</label><input id="sellPrice" type="number" step="0.01" placeholder="Ex.: 15">
<label>Margem desejada (%)</label><input id="margin" type="number" step="1" value="50">
<button onclick="calculate()">Calcular preço</button>
<div class="total" id="result">Custo: R$ 0,00</div>
<div id="details"></div>
<button onclick="saveProduct()">Salvar produto</button>
</section>

<section class="card full">
<h2>📋 Produtos cadastrados</h2>
<div id="products"></div>
</section>
</div>
</div>

<script>
let ingredients=JSON.parse(localStorage.getItem('pp_ingredients')||'[]');
let products=JSON.parse(localStorage.getItem('pp_products')||'[]');

function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function baseQty(q,u){if(u==='kg'||u==='L')return q*1000;return q}
function unitLabel(u){return u==='kg'?'g':u==='L'?'ml':u}

function addIngredient(){
 const name=ingName.value.trim(), q=Number(ingQty.value), u=ingUnit.value, p=Number(ingPrice.value);
 if(!name||q<=0||p<0)return alert('Preencha os dados do ingrediente.');
 const quantity=baseQty(q,u);
 ingredients.push({id:Date.now(),name,quantity,unit:unitLabel(u),price:p,original:q,originalUnit:u});
 localStorage.setItem('pp_ingredients',JSON.stringify(ingredients)); render();
 ingName.value=ingQty.value=ingPrice.value='';
}
function delIng(id){ingredients=ingredients.filter(x=>x.id!==id);localStorage.setItem('pp_ingredients',JSON.stringify(ingredients));render()}

function render(){
 kIng.textContent=ingredients.length;kProd.textContent=products.length;
 ingredientsDiv();
 productsDiv(); updateSelects();
}
function ingredientsDiv(){
 if(!ingredients.length){ingredients.innerHTML='<div class="empty">Nenhum ingrediente cadastrado.</div>';return}
 ingredients.innerHTML='<table><tr><th>Ingrediente</th><th>Compra</th><th>Custo/base</th><th></th></tr>'+
 ingredients.map(x=>`<tr><td>${x.name}</td><td>${x.original} ${x.originalUnit} — ${money(x.price)}</td><td>${money(x.price/x.quantity)}/${x.unit}</td><td><button class="danger" onclick="delIng(${x.id})">Excluir</button></td></tr>`).join('')+'</table>';
}
function addRecipeRow(){
 const d=document.createElement('div');d.className='recipe-row';
 d.innerHTML=`<select class="ri"><option value="">Selecione</option>${ingredients.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
 <input class="rq" type="number" min="0" step="0.001" placeholder="Quantidade">
 <select class="ru"><option value="g">g</option><option value="ml">ml</option><option value="un">un</option></select>
 <button class="danger" onclick="this.parentElement.remove()">×</button>`;
 recipe.appendChild(d);
}
function updateSelects(){
 document.querySelectorAll('.ri').forEach(s=>{let val=s.value;s.innerHTML='<option value="">Selecione</option>'+ingredients.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');s.value=val});
}
function getRecipe(){
 return [...document.querySelectorAll('.recipe-row')].map(r=>({id:Number(r.querySelector('.ri').value),qty:Number(r.querySelector('.rq').value),unit:r.querySelector('.ru').value})).filter(x=>x.id&&x.qty>0);
}
function calcData(){
 let list=getRecipe(), cost=0;
 list.forEach(r=>{let i=ingredients.find(x=>x.id===r.id);if(i)cost+=(i.price/i.quantity)*r.qty});
 return {list,cost};
}
function calculate(){
 let {list,cost}=calcData(), sale=Number(sellPrice.value), marginPct=Number(margin.value)||0;
 let suggested=marginPct<100?cost/(1-marginPct/100):0,profit=sale-cost,marginReal=sale?profit/sale*100:0;
 result.innerHTML='Custo: '+money(cost);
 details.innerHTML=`<p>Preço sugerido com ${marginPct}% de margem: <b>${money(suggested)}</b></p><p>Preço informado: <b>${money(sale)}</b> | Lucro: <b>${money(profit)}</b> | Margem real: <b>${marginReal.toFixed(1)}%</b></p>`;
 kCost.textContent=money(cost);kProfit.textContent=money(profit);
 return {list,cost,sale,suggested,profit};
}
function saveProduct(){
 let name=prodName.value.trim(), data=calculate();
 if(!name||!data.list.length)return alert('Informe o nome e pelo menos um ingrediente.');
 products.push({id:Date.now(),name,recipe:data.list,cost:data.cost,sale:data.sale,suggested:data.suggested,profit:data.profit});
 localStorage.setItem('pp_products',JSON.stringify(products));render();
 prodName.value='';recipe.innerHTML='';sellPrice.value='';details.innerHTML='';result.textContent='Custo: R$ 0,00';
}
function delProd(id){products=products.filter(x=>x.id!==id);localStorage.setItem('pp_products',JSON.stringify(products));render()}
function productsDiv(){
 if(!products.length){products.innerHTML='<div class="empty">Nenhum produto salvo.</div>';return}
 products.innerHTML='<table><tr><th>Produto</th><th>Custo</th><th>Venda</th><th>Lucro</th><th></th></tr>'+
 products.map(p=>`<tr><td>${p.name}</td><td>${money(p.cost)}</td><td>${money(p.sale)}</td><td>${money(p.profit)}</td><td><button class="danger" onclick="delProd(${p.id})">Excluir</button></td></tr>`).join('')+'</table>';
}
render();
</script>
